name: NovaCoins
version: ${version}
main: net.watones.novacoins.NovaCoinsPlugin
api-version: '1.21'
authors: [Watones]
description: Economía secundaria por ciclos de sesión para Paper.
softdepend: [PlaceholderAPI]
commands:
  canjes:
    description: Abre la tienda de canjes.
    permission: novacoins.shop
  monedas:
    description: Consulta monedas y clasificación.
    permission: novacoins.use
    usage: /monedas [top [página]]
  novacoins:
    description: Administración de NovaCoins.
    usage: /novacoins <give|take|set|reset|balance|history|failures|review|recovery|retry|reload|status> ...
permissions:
  novacoins.use: {default: true}
  novacoins.shop: {default: true}
  novacoins.balance: {default: true}
  novacoins.top: {default: true}
  novacoins.admin: {default: op}
  novacoins.admin.give: {default: op}
  novacoins.admin.take: {default: op}
  novacoins.admin.set: {default: op}
  novacoins.admin.reset: {default: op}
  novacoins.admin.balance: {default: op}
  novacoins.admin.history: {default: op}
  novacoins.admin.failures: {default: op}
  novacoins.admin.review: {default: op}
  novacoins.admin.review.delivered: {default: op}
  novacoins.admin.review.refund: {default: op}
  novacoins.admin.review.retry: {default: false}
  novacoins.admin.recovery: {default: op}
  novacoins.admin.retry: {default: op}
  novacoins.admin.reload: {default: op}
  novacoins.admin.status: {default: op}
